<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Console</title>
<style>
  :root {
    --bg: #0b0e0c;
    --panel: #121611;
    --line: #23291f;
    --text: #d8ded4;
    --muted: #7c8a76;
    --green: #5fff9f;
    --amber: #ffb454;
    --red: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 20px 28px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    margin: 0;
  }
  header span.sub {
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 61px);
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }
  .control-panel {
    border-right: 1px solid var(--line);
    padding: 24px;
  }
  .control-panel label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 14px;
    resize: vertical;
    min-height: 100px;
  }
  textarea:focus, button:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }
  button#run {
    margin-top: 14px;
    width: 100%;
    background: var(--green);
    color: #04120a;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button#run:disabled {
    background: #2b3128;
    color: var(--muted);
    cursor: not-allowed;
  }
  .examples {
    margin-top: 24px;
    font-size: 12px;
  }
  .examples p { color: var(--muted); margin: 0 0 8px; }
  .examples button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 8px 10px;
    border-radius: 5px;
    margin-bottom: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--mono);
  }
  .examples button:hover { border-color: var(--green); color: var(--text); }

  .console {
    padding: 24px 28px;
    overflow-y: auto;
  }
  .empty-state {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 40px;
  }
  .frame {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
    animation: rise 0.25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .frame-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .badge.think { background: #1e2a3a; color: #7db8ff; }
  .badge.tool { background: #3a2f14; color: var(--amber); }
  .step-num { color: var(--muted); }
  .frame-body {
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .frame-body .io-label {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 8px;
    display: block;
  }
  .frame-body code {
    font-family: var(--mono);
    color: var(--green);
  }
  .answer-frame {
    border: 1px solid var(--green);
    background: linear-gradient(180deg, rgba(95,255,159,0.06), transparent);
    border-radius: 8px;
    padding: 16px;
    margin-top: 8px;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .answer-frame .label {
    color: var(--green);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 8px;
  }
  .error {
    color: var(--red);
    font-family: var(--mono);
    font-size: 13px;
    border: 1px solid var(--red);
    padding: 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Agent Console</h1>
  <span class="sub">plan &rarr; act &rarr; observe</span>
</header>

<main>
  <section class="control-panel">
    <label for="goal">Goal</label>
    <textarea id="goal" placeholder="e.g. Find the current price of Bitcoin in USD, convert it to INR, and save both figures as notes."></textarea>
    <button id="run">Run agent</button>

    <div class="examples">
      <p>Try an example</p>
      <button data-goal="What is 18% tip on a $142.50 bill, and what's the total?">18% tip on $142.50 bill, total?</button>
      <button data-goal="Search for the latest news about AI agents and summarize the top 3 findings as notes, then give me a summary.">Research + summarize AI agent news</button>
      <button data-goal="Calculate compound interest on $5000 at 6% annual rate for 10 years, save the result as a note, then explain it simply.">Compound interest walkthrough</button>
    </div>
  </section>

  <section class="console" id="console">
    <div class="empty-state" id="empty">&gt; awaiting goal_</div>
  </section>
</main>

<script>
const goalEl = document.getElementById('goal');
const runBtn = document.getElementById('run');
const consoleEl = document.getElementById('console');
const emptyEl = document.getElementById('empty');

document.querySelectorAll('.examples button').forEach(b => {
  b.addEventListener('click', () => { goalEl.value = b.dataset.goal; });
});

function frameFor(entry) {
  const div = document.createElement('div');
  div.className = 'frame';

  if (entry.type === 'think') {
    div.innerHTML = `
      <div class="frame-head">
        <span class="badge think">THINK</span>
        <span class="step-num">step ${entry.step}</span>
      </div>
      <div class="frame-body">${escapeHtml(entry.content)}</div>
    `;
  } else {
    div.innerHTML = `
      <div class="frame-head">
        <span class="badge tool">TOOL</span>
        <span class="step-num">step ${entry.step}</span>
        <code>${escapeHtml(entry.tool)}</code>
      </div>
      <div class="frame-body">
        <span class="io-label">input</span>${escapeHtml(JSON.stringify(entry.input))}
        <span class="io-label">output</span>${escapeHtml(entry.output)}
      </div>
    `;
  }
  return div;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function runAgent() {
  const goal = goalEl.value.trim();
  if (!goal) { goalEl.focus(); return; }

  runBtn.disabled = true;
  runBtn.textContent = 'Running…';
  consoleEl.innerHTML = '';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${res.status})`);
    }

    const data = await res.json();

    data.trace.forEach(entry => consoleEl.appendChild(frameFor(entry)));

    const answerDiv = document.createElement('div');
    answerDiv.className = 'answer-frame';
    answerDiv.innerHTML = `<span class="label">Final answer &middot; ${data.steps_used} step(s)</span>${escapeHtml(data.answer)}`;
    consoleEl.appendChild(answerDiv);

  } catch (e) {
    const errDiv = document.createElement('div');
    errDiv.className = 'error';
    errDiv.textContent = `Error: ${e.message}`;
    consoleEl.appendChild(errDiv);
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = 'Run agent';
  }
}

runBtn.addEventListener('click', runAgent);
goalEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runAgent();
});
</script>

</body>
</html>
